openapi: 3.0.0
info:
  title: EduVerse Work API
  description: EduVerse Work 플랫폼의 프론트엔드와 백엔드 연동을 위한 REST API 명세서입니다. 현재 프론트엔드 목업 데이터 구조를 기반으로 작성되었습니다.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Mock JSON Server
paths:
  /user:
    get:
      summary: 내 정보 조회
      description: 현재 로그인한 사용자의 프로필 정보를 반환합니다.
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /workspaces:
    get:
      summary: 전체 워크스페이스 목록 조회 및 검색
      description: 플랫폼 내의 모든 워크스페이스를 조회합니다. `q` 파라미터를 통해 검색할 수 있습니다.
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: 검색어 (워크스페이스 이름 또는 초대 코드)
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
  /my_workspaces:
    get:
      summary: 내 워크스페이스 목록 조회
      description: 내가 가입했거나 참여 신청 대기 중인 워크스페이스 목록을 반환합니다.
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      summary: 워크스페이스 참여 신청 (Mock)
      description: |
        특정 워크스페이스에 참여를 신청합니다.
        *참고: 실제 백엔드에서는 `POST /workspaces/{id}/apply` 형태가 권장되지만, 현재 json-server 목업 환경에서는 `/my_workspaces` 리소스에 데이터를 추가하는 방식으로 구현되어 있습니다.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workspace"
      responses:
        "201":
          description: 신청 성공 (생성됨)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /sidebar_menus:
    get:
      summary: 사이드바 메뉴 구조 조회
      description: 워크스페이스 사이드바에 표시될 동적 메뉴 구조를 반환합니다.
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  study:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuItem"
                  community:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuItem"
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "김지수"
        email:
          type: string
          example: "jisoo.kim@techcorp.com"
        profileImage:
          type: string
          example: "https://ui-avatars.com/..."
    Workspace:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "TechCorp HQ"
        logo_url:
          type: string
          nullable: true
          example: "https://..."
        location:
          type: string
          example: "Seoul, Korea"
        description:
          type: string
          example: "전사 공통 교육..."
        memberCount:
          type: integer
          example: 1420
        courseCount:
          type: integer
          example: 5
        join_code:
          type: string
          example: "TC1234"
        role:
          type: string
          enum: [LEARNER, TRAINER]
          nullable: true
          example: "LEARNER"
        status:
          type: integer
          description: "0: 미참여, 1: 승인 대기, 2: 참여 중"
          enum: [0, 1, 2]
          example: 2
        themeColor:
          type: string
          enum: [indigo, blue, amber]
          example: "indigo"
        typeIcon:
          type: string
          example: "domain"
    MenuItem:
      type: object
      properties:
        id:
          type: string
          example: "dashboard"
        name:
          type: string
          example: "대시보드"
        icon:
          type: string
          example: "dashboard"
        path:
          type: string
          example: "#"