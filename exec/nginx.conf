worker_processes  1;
events { worker_connections  1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name i14a309.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on; # gRPC 통신을 위해 필수
        server_name i14a309.p.ssafy.io;

        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;

        # 1. gRPC 서비스 통합 설정 (Emotion, Quiz, STT)
        location ~ ^/(EmotionService|QuizService|STTService)/ {
            grpc_pass grpc://127.0.0.1:50051;

            # 스트리밍(STT, Emotion)을 위한 타임아웃 확장 (1시간)
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;

            # 음성 및 이미지 데이터 전송을 위한 버퍼 최적화
            grpc_buffer_size 128k;
            client_max_body_size 20M;

            error_page 502 = /error502grpc;
        }

        # 2. FastAPI 서버 설정
        location /fastapi/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # LLM(GPT) 응답 대기를 위해 타임아웃 연장
            proxy_read_timeout 300s;
        }

        # 3. Spring API 요청
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Janus 시그널링 및 Spring Websocket
        location /janus_ws {
            proxy_pass http://127.0.0.1:8080/ws/janus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location ~ ^/(voice|emotion|message) {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        # 5. 젠킨스
        location /jenkins {
            proxy_pass http://127.0.0.1:9999;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect http://127.0.0.1:9999 https://i14a309.p.ssafy.io/jenkins;
        }
        # 6. 프론트엔드 기본 경로 (가장 아래에 위치)
        location / {

            root   /usr/share/nginx/html; # 빌드된 dist 폴더의 경로
            index  index.html index.htm;
            include /etc/nginx/mime.types;
            # Vue Router(History Mode)를 사용할 때 매우 중요한 설정
            try_files $uri $uri/ /index.html;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}