syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.edumax.molip.grpc.emotion";

service EmotionService {
  rpc AnalyzeEmotion (stream EmotionRequest) returns (stream EmotionResponse);
}

message EmotionRequest {
  bytes image_data = 1;
  string member_id = 2;
  int32 timeline = 3;
}

message EmotionResponse {
  string emotion1 = 1;
  float confidence1 = 2;
  string emotion2 = 3;
  float confidence2 = 4;
  string emotion3 = 5;
  float confidence3 = 6;
  int32 timeline = 7;
}
