syntax = "proto3";

package connection;

option java_multiple_files = true;
option java_package = "com.edumax.molip.grpc.connection";
option java_outer_classname = "ConnectionProto";

// [Service] 연결 확인용 서비스
service ConnectionService {
  rpc Ping (PingRequest) returns (PongResponse);
} // rpc + 서버메서드이름 + (요청메시지) + (응답메시지)
// req와 res 앞에 stream을 붙이면 메시지를 쪼개서 보낼 수 있음

// [Request] "Hello" 또는 현재 시간 등을 담아 보냄
message PingRequest {
  string message = 1;
}

// [Response] 서버의 응답
message PongResponse {
  string reply = 1;
  bool status = 2;
}
