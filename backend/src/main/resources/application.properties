spring.application.name=molip

# MySQL ?????? ??
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret-key=${JWT_SECRET}
jwt.refresh-token.expiration-day=14
jwt.access-token.expiration-minute=60

#log
logging.level.com.edumax.molip=TRACE
server.error.include-stacktrace=always
logging.level.org.springframework.web=TRACE

# redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# gRPC ?? ??
grpc.server.port=50051

# gRPC ????? ??
grpc.client.connectionService.address=static://127.0.0.1:50051
grpc.client.connectionService.negotiation-type=plaintext
